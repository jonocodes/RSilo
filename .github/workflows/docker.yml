name: docker

# Builds the offline-server image for amd64 and arm64, each on a native runner,
# on every push and PR, and smoke-tests each. On main each leg pushes its image
# by digest, then `manifest` joins them under ghcr.io/jonocodes/rsilo (:main and
# :sha-<commit>).

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jonocodes/rsilo

jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A docker-container builder can push by digest. Dating the build at the
      # commit (SOURCE_DATE_EPOCH) lets Publish rebuild from cache to the same
      # image that was tested here.
      - name: Set up buildx
        run: |
          docker buildx create --use --name rsilo
          epoch=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "BUILD_ARGS=--platform linux/${{ matrix.arch }} --provenance=false \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --label org.opencontainers.image.version=sha-${GITHUB_SHA::7} \
            --label org.opencontainers.image.created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          # shellcheck disable=SC2086 # BUILD_ARGS is a list of flags
          docker buildx build $BUILD_ARGS --load -t rsilo:ci .

      # Without our own labels the base image's leak through, linking the GHCR
      # package to oven-sh/bun and describing it as bun.
      - name: Check labels
        run: |
          label() { docker inspect rsilo:ci --format "{{ index .Config.Labels \"org.opencontainers.image.$1\" }}"; }
          test "$(label source)" = "https://github.com/$GITHUB_REPOSITORY" || { echo "image.source is '$(label source)'"; exit 1; }
          test "$(label revision)" = "$GITHUB_SHA" || { echo "image.revision is '$(label revision)'"; exit 1; }
          test "$(label title)" = rsilo || { echo "image.title is '$(label title)'"; exit 1; }
          test "$(docker inspect rsilo:ci --format '{{.Architecture}}')" = ${{ matrix.arch }}

      # Start it, mint a token, write and read a document, and check that the
      # dev identity is off now that the server listens beyond loopback.
      - name: Smoke test
        run: |
          docker run -d --name rsilo -p 127.0.0.1:8787:8787 rsilo:ci
          for _ in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:8787/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8787/health
          token=$(docker exec rsilo bun src/scripts/dev-token.ts alice '*:rw' | tail -1)
          curl -sf -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: text/plain' --data hello \
            http://127.0.0.1:8787/storage/alice/ci/hello.txt
          test "$(curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:8787/storage/alice/ci/hello.txt)" = hello
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:8787' http://127.0.0.1:8787/account)
          test "$status" = 503 || { echo "dev identity reachable: /account answered $status"; exit 1; }
          docker stop rsilo

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # shellcheck disable=SC2086 # BUILD_ARGS is a list of flags
          docker buildx build $BUILD_ARGS --metadata-file meta.json \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" .
          mkdir digests
          jq -r '."containerimage.digest"' meta.json > digests/${{ matrix.arch }}

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1

  # Tags one multi-platform image from the per-arch digests, and checks both
  # platforms made it in.
  manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # shellcheck disable=SC2046 # one argument per digest
          docker buildx imagetools create -t "$IMAGE:main" -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            $(sed "s|^|$IMAGE@|" digests/*)
          platforms=$(docker buildx imagetools inspect --raw "$IMAGE:sha-${GITHUB_SHA::7}" \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')
          test "$platforms" = "linux/amd64 linux/arm64" || { echo "platforms: $platforms"; exit 1; }
