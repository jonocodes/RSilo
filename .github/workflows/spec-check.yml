name: remoteStorage spec-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # local: the offline server's directory storage. s3: the S3 backend
        # (ADR-0005) against a SeaweedFS S3 container (credentials from
        # test/fixtures/seaweedfs-s3.json, so request signatures are verified),
        # which also runs test/s3-live.test.ts. MinIO no longer publishes
        # community images.
        storage: [local, s3]
    name: spec-check (${{ matrix.storage }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start SeaweedFS S3
        if: matrix.storage == 's3'
        run: |
          set -euo pipefail
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/test/fixtures:/cfg:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/cfg/seaweedfs-s3.json
          # Any HTTP answer (unauthenticated requests get 403) means it is up.
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)" != "000" ]; then break; fi
            sleep 1
          done
          curl -s -o /dev/null -w 'SeaweedFS S3: HTTP %{http_code}\n' http://localhost:8333/
          {
            echo "S3_ENDPOINT=http://localhost:8333"
            echo "S3_BUCKET=rsilo-spec"
            echo "S3_ACCESS_KEY_ID=rsiloadmin"
            echo "S3_SECRET_ACCESS_KEY=rsilo-secret-123"
          } >> "$GITHUB_ENV"

      - name: Live S3Storage test (creates the bucket)
        if: matrix.storage == 's3'
        run: bunx vitest run test/s3-live.test.ts
        env:
          RSILO_S3_LIVE_ENDPOINT: http://localhost:8333
          RSILO_S3_LIVE_BUCKET: rsilo-spec
          RSILO_S3_LIVE_ACCESS_KEY_ID: rsiloadmin
          RSILO_S3_LIVE_SECRET_ACCESS_KEY: rsilo-secret-123

      - name: Run remoteStorage spec-check
        run: |
          set -euo pipefail

          mkdir -p /tmp/rsilo
          STORAGE_DIR=/tmp/rsilo/storage \
          DB_PATH=/tmp/rsilo/db.sqlite \
          PORT=8788 \
          bun run src/server-offline.ts > /tmp/rsilo/server.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8788/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8788/health
          head -3 /tmp/rsilo/server.log

          # dev-token creates the Account row (alice, the dev default) if it is missing.
          RW=$(DB_PATH=/tmp/rsilo/db.sqlite bun run dev-token alice 'api-test-suite:rw' | tail -1)
          RO=$(DB_PATH=/tmp/rsilo/db.sqlite bun run dev-token alice 'api-test-suite:r' | tail -1)
          GL=$(DB_PATH=/tmp/rsilo/db.sqlite bun run dev-token alice '*:rw' | tail -1)

          git clone https://github.com/0dataapp/spec-check /tmp/spec-check
          cd /tmp/spec-check
          git checkout e969675a41c8bbffa35dc8d8c0eea0e82846695b
          npm install --no-audit --no-fund

          cat > .env <<EOF2
          SERVER_URL="http://localhost:8788"
          ACCOUNT_HANDLE="alice"
          TOKEN_READ_WRITE="$RW"
          TOKEN_READ_ONLY="$RO"
          TOKEN_GLOBAL="$GL"
          EOF2

          npm test
