name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:test

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Bundles the Worker as `wrangler deploy` would, without credentials or
      # uploading anything, so a bundle that does not build fails here.
      - name: Worker bundle
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
