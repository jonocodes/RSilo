name = "opendal-worker-proto"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

[vars]
S3_ENDPOINT = "http://127.0.0.1:8333"
S3_BUCKET = "rsilo-proto"
S3_REGION = "us-east-1"
S3_ACCESS_KEY_ID = "rsiloadmin"
# Local SeaweedFS fixture only; a real deploy uses `wrangler secret put`.
S3_SECRET_ACCESS_KEY = "rsilo-secret-123"
