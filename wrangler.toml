# Committed config with placeholder resource IDs so the "Deploy to Cloudflare"
# button can provision fresh resources in the deployer's account.
# Never commit real IDs here — local production IDs live in the gitignored
# wrangler.prod.toml (written by `bun run setup`).
name = "rsilo"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "remotestorage"

[[d1_databases]]
binding = "DB"
database_name = "remotestorage-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/migrations"

# Native rate limiting: counters live in Cloudflare, not KV, so they cost no
# KV writes. namespace_id is an arbitrary label, not a provisioned resource.
# Limits must match RATE_LIMITS in src/services/rate-limit.ts (test-enforced).
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "STORAGE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[observability]
enabled = true

# Required production secrets — set each with `wrangler secret put`:
#   SESSION_SECRET   — signs file manager and OAuth session cookies
#   ADMIN_SECRET     — protects /admin/* endpoints
#   JWT_SECRET       — verifies signed JWT access tokens
# RSILO_DEV_MODE is only for local development and must never be deployed.
