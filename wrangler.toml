# Committed config with placeholder resource IDs so the "Deploy to Cloudflare"
# button can provision fresh resources in the deployer's account.
# Never commit real IDs here — local production IDs live in the gitignored
# wrangler.prod.toml (written by `bun run setup`).
name = "rsilo"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "remotestorage"

[[d1_databases]]
binding = "DB"
database_name = "remotestorage-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "00000000000000000000000000000000"

[observability]
enabled = true

# Secrets — set via `wrangler secret put` or in .dev.vars for local `wrangler dev`:
#   SESSION_SECRET   — signs file manager session cookies (required)
#   ADMIN_SECRET     — protects /admin/* endpoints (optional; open if unset)
