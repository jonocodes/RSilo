name = "rsilo"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "remotestorage"

[[d1_databases]]
binding = "DB"
database_name = "remotestorage-db"
database_id = "4952ded9-7a41-41bf-97fd-7348ba1d47bd"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e977c15659514ce19d92b2a5f355d912"

[observability]
enabled = true

# Secrets — set via `wrangler secret put` or in .dev.vars for local `wrangler dev`:
#   SESSION_SECRET   — signs file manager session cookies (required)
#   ADMIN_SECRET     — protects /admin/* endpoints (optional; open if unset)
