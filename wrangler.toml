# Committed config with placeholder resource IDs so the "Deploy to Cloudflare"
# button can provision fresh resources in the deployer's account.
# Never commit real IDs here — local production IDs live in the gitignored
# wrangler.prod.toml (written by `bun run setup`).
name = "rsilo"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "remotestorage"

[[d1_databases]]
binding = "DB"
database_name = "remotestorage-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/migrations"

# Native rate limiting: counters live in Cloudflare, not KV, so they cost no
# KV writes. namespace_id is an arbitrary label, not a provisioned resource.
# Limits must match RATE_LIMITS in src/services/rate-limit.ts (test-enforced).
[[ratelimits]]
name = "STORAGE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[observability]
enabled = true

# Per-Instance configuration: plain-text vars. RSilo needs no secrets:
# Cloudflare Access signs the Owner in to /account.
#   OWNER_EMAIL      — required: the Owner's email; only it may use /account.
#                      Until it is set, /account shows a "finish setup" page;
#                      storage, WebFinger and the token endpoint keep working.
# Optional, set in the Worker's dashboard (Settings → Variables and Secrets):
#   ACCOUNT_USERNAME — the one Account this Instance serves ([a-z0-9_.-]+);
#                      default "me", so the storage address is me@<host>
#   PUBLIC_BASE_URL  — canonical origin for every advertised URL, e.g. a
#                      custom domain; default: the request's own origin
#   MAX_OBJECT_SIZE_BYTES — default 10 MiB
# OWNER_EMAIL is empty here on purpose: the Deploy to Cloudflare button asks
# for it, and `bun run setup` writes the real value into wrangler.prod.toml.
# `bun run deploy` drops empty entries before deploying (and deploys with
# --keep-vars), so it never blanks a value set in the Worker's dashboard.
# RSILO_DEV_MODE is only for local development and must never be deployed.
[vars]
OWNER_EMAIL = ""
