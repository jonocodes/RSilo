# Committed config with placeholder resource IDs so the "Deploy to Cloudflare"
# button can provision fresh resources in the deployer's account.
# Never commit real IDs here — local production IDs live in the gitignored
# wrangler.prod.toml (written by `bun run setup`).
name = "rsilo"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "remotestorage"

[[d1_databases]]
binding = "DB"
database_name = "remotestorage-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle/migrations"

# Native rate limiting: counters live in Cloudflare, not KV, so they cost no
# KV writes. namespace_id is an arbitrary label, not a provisioned resource.
# Limits must match RATE_LIMITS in src/services/rate-limit.ts (test-enforced).
[[ratelimits]]
name = "STORAGE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[observability]
enabled = true

# Per-Instance configuration: plain-text vars, all required in production.
# RSilo needs no secrets: Cloudflare Access signs the Owner in to /account.
#   ACCOUNT_USERNAME — the one Account this Instance serves ([a-z0-9_.-]+)
#   OWNER_EMAIL      — the Owner's email; only it may use /account
#   PUBLIC_BASE_URL  — origin every advertised URL is built from, e.g.
#                      https://rsilo.<your-subdomain>.workers.dev
# They are empty here on purpose. The Deploy to Cloudflare button asks for
# them; `bun run setup` writes real values into wrangler.prod.toml. An empty
# value never passes validation: the Instance shows its "finish setup" page and
# refuses storage and OAuth requests. `bun run deploy` drops empty entries
# before deploying, so it never blanks values set in the Worker's dashboard.
# Optional: MAX_OBJECT_SIZE_BYTES (default 10 MiB).
# RSILO_DEV_MODE is only for local development and must never be deployed.
[vars]
ACCOUNT_USERNAME = ""
OWNER_EMAIL = ""
PUBLIC_BASE_URL = ""
